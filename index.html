<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>بصير نحكي؟</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="apology-shell">
      <section class="talk-card" aria-live="polite">
        <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>
        <p class="tiny-line" id="tinyLine">طلب صغير قبل ما تزعلي زيادة</p>
        <h1 id="questionTitle">بصير نحكي؟</h1>
        <p class="subtitle" id="subtitle">
          عندي اعتذار جاهز.
        </p>

        <div class="choice-row" id="choiceRow">
          <button class="yes-button" type="button" id="yesButton">آه</button>
          <button class="no-button" type="button" id="noButton">لا</button>
        </div>

        <div class="music-row">
          <button class="music-button" type="button" id="musicButton">شغلي الأغنية</button>
          <span class="music-status" id="musicStatus">الأغنية بتشتغل بعد ضغطة منك.</span>
        </div>

        <audio id="song" preload="auto" loop>
          <source src="assets/song.mp3" type="audio/mpeg" />
        </audio>

        <div class="apology-message" id="apologyMessage">
          <p class="tiny-line">طيب، خليني أقولها صح</p>
          <h2>أنا آسف من قلبي</h2>
          <p id="typedApology"></p>
          <p class="final-line" id="finalLine">سامحيني؟</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
